image: maven:3.9.9-eclipse-temurin-21
# Variables globales
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# Cache pour les dépendances Maven
cache:
  paths:
    - .m2/repository/
    - target/

# Stages de la pipeline
stages:
  - validate
  - test
  - build
#  - package

# Stage 1: Validation du code
validate:
  stage: validate
  script:
    - echo "Validation du projet..."
    - mvn $MAVEN_CLI_OPTS validate
    - mvn $MAVEN_CLI_OPTS compile
  only:
    - branches

# Stage 2: Tests unitaires
test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test -Dspring.profiles.active=test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    expire_in: 1 week
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - branches

# Stage 3: Build du projet
build:
  stage: build
  script:
    - echo "Build du projet..."
    - mvn $MAVEN_CLI_OPTS compile
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.jar
      - target/*.war
    expire_in: 1 week
  only:
    - branches

